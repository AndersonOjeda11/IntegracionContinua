# Orquestacion de los dos contenedores. Se levanta con:  docker compose up -d --build
# Las variables ${...} se leen del archivo .env (copie .env.example como .env).
name: calculadora

services:
  # Contenedor 1: la aplicacion (API de la calculadora).
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: calculadora-app:1.0
    container_name: calculadora-app
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      DB_HOST: db # nombre del servicio de la base de datos dentro de la red de Docker
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en el archivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_calculadora
    restart: unless-stopped

  # Contenedor 2: base de datos PostgreSQL que guarda las operaciones.
  db:
    image: postgres:17.11-alpine
    container_name: calculadora-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en el archivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
    expose:
      - "5432" # solo dentro de la red; no se publica en el equipo anfitrion
    volumes:
      - datos_db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - red_calculadora
    restart: unless-stopped

networks:
  red_calculadora:
    name: red_calculadora
    driver: bridge

volumes:
  datos_db:
    name: calculadora_datos_db
