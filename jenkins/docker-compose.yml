# Jenkins de la Entrega 2. Se levanta con:
#   cp jenkins/.env.example jenkins/.env      (y cambie las contrasenas)
#   docker compose -f jenkins/docker-compose.yml up -d --build
# Interfaz web: http://localhost:8080
name: jenkins-calculadora

services:
  jenkins:
    build: .
    image: jenkins-calculadora:1.0
    container_name: jenkins
    ports:
      - "127.0.0.1:8080:8080" # interfaz web, solo accesible desde este equipo
      - "127.0.0.1:50000:50000" # agentes de Jenkins (opcional)
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:?Defina JENKINS_ADMIN_ID en jenkins/.env}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Defina JENKINS_ADMIN_PASSWORD en jenkins/.env}
      CI_POSTGRES_USER: ${CI_POSTGRES_USER:?Defina CI_POSTGRES_USER en jenkins/.env}
      CI_POSTGRES_PASSWORD: ${CI_POSTGRES_PASSWORD:?Defina CI_POSTGRES_PASSWORD en jenkins/.env}
    group_add:
      - "0" # grupo duenno de /var/run/docker.sock en Docker Desktop
    volumes:
      - jenkins_home:/var/jenkins_home # configuracion, jobs e historial de builds
      - /var/run/docker.sock:/var/run/docker.sock # Jenkins usa el Docker del equipo
    restart: unless-stopped

volumes:
  jenkins_home:
